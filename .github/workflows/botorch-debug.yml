# temporary: diagnose botorch segfaults on ubuntu-26.04, remove before merging
on:
  pull_request:
    branches:
      - main

name: botorch debug

jobs:
  botorch:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: "always"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install botorch environment
        run: R -q -e 'source("R/install_python_test_envs.R"); install_python_test_envs("botorch")'

      - name: Install package
        run: R CMD INSTALL --no-docs .

      - name: System info
        run: |
          lscpu | head -20
          ldd --version | head -1
          sudo apt-get install -y gdb > /dev/null

      - name: Plain python
        continue-on-error: true
        run: ~/.virtualenvs/mlr3extralearners-botorch/bin/python .github/debug/botorch_repro.py

      - name: R with reticulate only
        continue-on-error: true
        run: R -d gdb --debugger-args='-q -batch -x .github/debug/gdbcmds' --vanilla -f .github/debug/botorch_repro.R --args reticulate

      - name: R with mlr3
        continue-on-error: true
        run: R -d gdb --debugger-args='-q -batch -x .github/debug/gdbcmds' --vanilla -f .github/debug/botorch_repro.R --args mlr3
