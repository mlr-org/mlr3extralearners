# temporary: diagnose botorch segfaults on ubuntu-26.04, remove before merging
on:
  pull_request:
    branches:
      - main

name: botorch debug

jobs:
  botorch:
    runs-on: ubuntu-latest
    name: botorch (${{ matrix.variant }})

    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, omp1, preload]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: "always"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install botorch environment
        run: R -q -e 'source("R/install_python_test_envs.R"); install_python_test_envs("botorch")'

      - name: Install package
        run: R CMD INSTALL --no-docs .

      - name: Run botorch tests
        run: |
          site=$HOME/.virtualenvs/mlr3extralearners-botorch/lib/python3.12/site-packages
          ls $site/torch/lib | grep -i omp || true
          ldd $(Rscript -e 'cat(system.file("libs/data_table.so", package = "data.table"))') | grep -i omp
          case "${{ matrix.variant }}" in
            omp1) export OMP_NUM_THREADS=1 ;;
            preload) export LD_PRELOAD=$site/torch/lib/libgomp.so.1 ;;
          esac
          Rscript -e 'res = testthat::test_dir("tests/testthat", filter = "botorch", package = "mlr3extralearners", load_package = "installed", stop_on_failure = TRUE)'
