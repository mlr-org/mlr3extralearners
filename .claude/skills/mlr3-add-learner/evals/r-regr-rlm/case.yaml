name: r-regr-rlm
expected_outcome: |
  A new file R/learner_MASS_regr_rlm.R defines LearnerRegrRlm inheriting from LearnerRegr with a paradox parameter set
  derived from MASS::rlm's formals (psi, scale.est, k2, method, wt.method, maxit, acc, ...), weights passed from the task,
